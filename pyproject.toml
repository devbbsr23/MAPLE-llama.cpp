[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-llamacpp"
version = "0.1.0"
description = "Portable multi-model inference orchestration on a pre-compiled llama.cpp CUDA build (OpenAI-compatible API)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []          # standard library only
[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
maple = "maple.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
